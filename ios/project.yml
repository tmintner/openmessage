# XcodeGen spec for the iPadOS app.
#
# Regenerate with:  xcodegen generate --spec ios/project.yml
# The generated OpenMessage.xcodeproj and Info.plist are disposable build
# outputs (both git-ignored) — this file is the source of truth, which keeps the
# project reviewable as text instead of as a pbxproj merge hazard.
#
# Note `info.properties` below is the *only* place to add Info.plist keys:
# XcodeGen regenerates ios/Info.plist from this spec on every run, so editing
# that file directly silently loses the change on the next generate.
name: OpenMessage
options:
  bundleIdPrefix: com.openmessage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES

targets:
  OpenMessage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required: the app hard-crashes on the first Contacts read without it.
        # Contact names and photos are shown beside conversations, as on the Mac.
        NSContactsUsageDescription:
          OpenMessage uses your contacts to show names and photos for the people you message.
        # The backend serves the UI over plain HTTP on 127.0.0.1. Only loopback
        # is exempted, so real traffic (Google, WhatsApp, Signal) stays
        # TLS-enforced rather than disabling ATS wholesale.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    sources:
      - path: Sources
      # Shared verbatim with the Mac app: pure Contacts + Foundation, no AppKit,
      # so it compiles for both platforms untouched. Referenced rather than
      # copied so contact-matching fixes land on both apps at once.
      - path: ../macos/OpenMessage/Sources/ContactsManager.swift
    dependencies:
      - framework: build/OpenMessageKit.xcframework
        embed: false   # static archive: linked in, nothing to embed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openmessage.ios
        PRODUCT_NAME: OpenMessage
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Go's net package resolves DNS through libresolv.
        OTHER_LDFLAGS: "-lresolv"
        CODE_SIGN_STYLE: Automatic
